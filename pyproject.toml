[project]
name = "motivetag"
version = "0.1.0"
description = "A tag-based social network website."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.13,<2",
    "boto3>=1.26,<2",
    "cryptography>=44.0.1",
    "DBUtils>=3.0,<4",
    "Flask>=3.0,<4",
    "Flask-SocketIO>=5.3,<6",
    "gevent>=24.2",
    "gevent-websocket>=0.10.1",
    "gunicorn>=23,<27",
    # gunicorn's gevent worker imports packaging without declaring it.
    "packaging>=24",
    "prometheus-client>=0.21,<1",
    "PyMySQL>=1.1.1,<2",
    "python-dotenv>=1.0,<2",
    "pywebpush>=2.5.0",
    "sentry-sdk[flask]>=2.20,<3",
    "SQLAlchemy>=2.0,<3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.13",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
# pycodestyle errors, pyflakes, bugbear, bandit (security), isort
select = ["E4", "E7", "E9", "F", "B", "S", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
