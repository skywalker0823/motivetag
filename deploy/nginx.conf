# Plain HTTP on the compose network only: Cloudflare terminates TLS for visitors and
# reaches this server through the Cloudflare Tunnel (cloudflared, deploy/compose.yaml).
# Nothing is published on the host.

# Visitors arrive through cloudflared on the compose network, which passes Cloudflare's
# CF-Connecting-IP along. Trusted only from that network (deploy/compose.yaml), so
# logs and rate limits see the real visitor instead of the tunnel.
set_real_ip_from 172.30.70.0/24;
real_ip_header CF-Connecting-IP;

# Sign-in (PUT), sign-up (POST) and account deletion (DELETE, asks for the password):
# 10 attempts a minute per visitor, small bursts allowed. Slows password guessing
# without affecting anyone typing normally. GET maps to an empty key, which nginx
# does not limit.
map $request_method $auth_limit_key {
    POST    $binary_remote_addr;
    PUT     $binary_remote_addr;
    DELETE  $binary_remote_addr;
    default "";
}
limit_req_zone $auth_limit_key zone=auth:10m rate=10r/m;
limit_req_status 429;

# Compress text on the way to Cloudflare (it re-compresses for browsers as needed).
gzip on;
gzip_proxied any;
gzip_min_length 1024;
gzip_vary on;
gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# No nginx version in error pages or the Server header.
server_tokens off;

# Unknown host names get no response.
server {
    listen 8080 default_server;
    server_name _;
    return 444;
}

server {
    listen 8080;
    server_name www.motivetag.com;
    return 301 https://motivetag.com$request_uri;
}

server {
    listen 8080;
    server_name motivetag.com;

    client_max_body_size 5m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Browser features no page uses stay off, also for anything injected.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()" always;
    # Other sites' windows (a link opened from a post) cannot reach back into ours.
    add_header Cross-Origin-Opener-Policy same-origin always;
    # The Content-Security-Policy comes from the app (api/security.py): its nonce
    # changes with every page.

    # Prometheus metrics are for Grafana Alloy on the Docker network only.
    location = /metrics {
        return 404;
    }

    location = /api/v1/account {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /api/member {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Socket.IO websockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }
}
