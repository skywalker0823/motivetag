# TLS terminates here with the Cloudflare origin certificate; only Cloudflare's
# IP ranges can reach port 443 (see infra/main/network.tf).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

ssl_certificate     /etc/nginx/certs/origin.pem;
ssl_certificate_key /etc/nginx/certs/origin.key;
ssl_protocols       TLSv1.2 TLSv1.3;

# Unknown host names get no response.
server {
    listen 443 ssl default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl;
    server_name www.motivetag.com;
    return 301 https://motivetag.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name motivetag.com;

    client_max_body_size 5m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Socket.IO websockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }
}
