# TLS terminates here with the Cloudflare origin certificate; only Cloudflare's
# IP ranges can reach port 443 (see infra/main/network.tf).

# Client addresses come from Cloudflare's CF-Connecting-IP, trusted only from
# Cloudflare's ranges (https://www.cloudflare.com/ips/). Logs and rate limits then
# see the real visitor instead of a Cloudflare edge.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
real_ip_header CF-Connecting-IP;

# Sign-in (PUT) and sign-up (POST): 10 attempts a minute per visitor, small bursts
# allowed. Slows password guessing without affecting anyone typing normally. Other
# methods on /api/member map to an empty key, which nginx does not limit.
map $request_method $auth_limit_key {
    POST    $binary_remote_addr;
    PUT     $binary_remote_addr;
    default "";
}
limit_req_zone $auth_limit_key zone=auth:10m rate=10r/m;
limit_req_status 429;

# Compress text on the way to Cloudflare (it re-compresses for browsers as needed).
gzip on;
gzip_proxied any;
gzip_min_length 1024;
gzip_vary on;
gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

ssl_certificate     /etc/nginx/certs/origin.pem;
ssl_certificate_key /etc/nginx/certs/origin.key;
ssl_protocols       TLSv1.2 TLSv1.3;

# Unknown host names get no response.
server {
    listen 443 ssl default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl;
    server_name www.motivetag.com;
    return 301 https://motivetag.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name motivetag.com;

    client_max_body_size 5m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /api/member {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Socket.IO websockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }
}
