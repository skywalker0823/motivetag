# Production stack. deploy.sh copies this file out of the app image and writes
# the .env next to it (image tag, secrets from Parameter Store).
name: motivetag

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: motivetag
      MYSQL_USER: motivetag
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - /srv/motivetag/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u motivetag -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  app:
    image: ${APP_IMAGE}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      FLASK_CONFIG: pro
      SECRET_KEY: ${SECRET_KEY}
      AWS_motivetag_DB: mysql
      DB_USER: motivetag
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: motivetag
      IMAGE_BUCKET: ${IMAGE_BUCKET}
      AWS_REGION: ${AWS_REGION}
      SENTRY_DSN: ${SENTRY_DSN:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SES_REGION: ${SES_REGION:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      ADMIN_ACCOUNTS: ${ADMIN_ACCOUNTS:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      APOD_COPYRIGHTED_IMAGES: ${APOD_COPYRIGHTED_IMAGES:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  nginx:
    image: nginx:1.30-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "443:443"
    # Without a health check, `compose up --wait` treats a crash-looping nginx as up.
    healthcheck:
      test: ["CMD", "curl", "-fsk", "--resolve", "motivetag.com:443:127.0.0.1", "https://motivetag.com/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro

  # Server and app metrics to Grafana Cloud (deploy/alloy.alloy). Only started when
  # the Grafana settings are in Parameter Store: deploy.sh then sets
  # COMPOSE_PROFILES=monitoring. No Docker socket, no privileges, host paths read-only.
  alloy:
    image: grafana/alloy:v1.20.0
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      GRAFANA_PROM_URL: ${GRAFANA_PROM_URL:-}
      GRAFANA_PROM_USER: ${GRAFANA_PROM_USER:-}
      GRAFANA_CLOUD_TOKEN: ${GRAFANA_CLOUD_TOKEN:-}
    volumes:
      - ./alloy.alloy:/etc/alloy/config.alloy:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    mem_limit: 256m
