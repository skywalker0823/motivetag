{# Shared <head> assets. `entry` is the page's module, e.g. "/js/pages/index.js". #}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070a16">
<script>
  // The member's look (帳號設定 → 外觀) before anything paints: the member page sets it
  // from the account (data-ui-server); other pages use this browser's last copy.
  (() => {
    const html = document.documentElement;
    if (html.dataset.uiServer) return;
    try {
      const ui = JSON.parse(localStorage.getItem("motivetag:ui") || "{}");
      for (const key of ["mode", "accent", "text"]) if (ui[key]) html.dataset[key] = ui[key];
    } catch {
      // No storage (private mode): the default look.
    }
  })();
</script>
<link rel="icon" href="{{ asset('/img/main.PNG') }}">
<link rel="stylesheet" href="{{ asset('/css/base.css') }}">
{% for sheet in stylesheets %}<link rel="stylesheet" href="{{ asset(sheet) }}">
{% endfor %}
<script type="importmap">{{ import_map() | safe }}</script>
{% for href in preload(entry) %}<link rel="modulepreload" href="{{ href }}">
{% endfor %}
<script type="module" src="{{ asset(entry) }}"></script>
