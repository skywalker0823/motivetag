<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#070a16">
    <title>討論 - MotiveTag</title>
    <link rel="icon" href="/img/main.PNG">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/tag.css">
    <script type="module" src="/js/pages/brick.js"></script>
</head>
<body>
    <header class="page-bar">
        <a class="btn btn--ghost btn--sm" id="back" href="/" data-icon="arrow-left">回到討論區</a>
    </header>
    <main class="page">
        <article class="card topic" id="topic" aria-live="polite">
            <div class="spinner" role="status" aria-label="載入中"></div>
        </article>

        <section class="replies" aria-labelledby="replies-title">
            <h2 class="replies__title" id="replies-title">回覆</h2>
            <form class="card reply-form" id="reply-form">
                <label class="visually-hidden" for="reply-input">回覆內容</label>
                <textarea class="textarea" id="reply-input" name="content" rows="3" maxlength="2000" placeholder="說說你的想法…"></textarea>
                <button class="btn" type="submit">回覆</button>
            </form>
            <ol class="reply-list" id="replies"></ol>
        </section>
    </main>
</body>
</html>
