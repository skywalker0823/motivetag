# Free uptime check (docs/adr/0006): GitHub e-mails the repository owner when a
# scheduled run fails. Schedules can start a few minutes late; that is fine here.
name: Uptime

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  healthz:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: https://motivetag.com/healthz answers through Cloudflare
        run: |
          curl -fsS --max-time 10 --retry 3 --retry-delay 20 --retry-all-errors \
            -A "motivetag-uptime (GitHub Actions)" https://motivetag.com/healthz
