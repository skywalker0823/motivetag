name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --frozen
      - run: uv run ruff check --output-format github
      - run: uv run ruff format --check

  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: testpw
          MYSQL_DATABASE: motivetag
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ptestpw"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      AWS_motivetag_DB: 127.0.0.1
      DB_PASSWORD: testpw
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --frozen
      - name: Migrations apply, roll back and re-apply cleanly
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - run: uv run pytest -v

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - run: terraform fmt -check -recursive infra
      - name: Validate each stack
        run: |
          for dir in infra/bootstrap infra/main; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Check dependencies for known vulnerabilities
        run: |
          uv export --frozen --no-dev --no-hashes --format requirements-txt > requirements-audit.txt
          uvx pip-audit --strict -r requirements-audit.txt

  image:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: testpw
          MYSQL_DATABASE: motivetag
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ptestpw"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: motivetag:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image with Trivy
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.74.0 image --quiet --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 motivetag:ci
      - name: Smoke test the production image (migrations + gunicorn worker)
        run: |
          docker run -d --name app --network host \
            -e AWS_motivetag_DB=127.0.0.1 -e DB_PASSWORD=testpw -e SECRET_KEY=ci \
            motivetag:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/healthz; then exit 0; fi
            sleep 2
          done
          docker logs app
          exit 1

  deploy:
    # Runs after every check passes on main, once the AWS side is set up
    # (repository variables from `terraform output github_variables`).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    needs: [lint, test, terraform, audit, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for AWS; no stored keys
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      IMAGE: ${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}
      IMAGE_BUCKET: ${{ vars.IMAGE_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
      - name: Deploy on the server via SSM
        run: |
          instance_id=$(aws ec2 describe-instances \
            --filters Name=tag:Project,Values=motivetag Name=instance-state-name,Values=running \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          echo "Deploying $IMAGE to $instance_id"
          registry=${IMAGE%%/*}
          params=$(jq -n --arg image "$IMAGE" --arg region "$AWS_REGION" \
            --arg bucket "$IMAGE_BUCKET" --arg registry "$registry" '{commands: [
              "set -e",
              "export PATH=\"$PATH:/snap/bin\"",
              "command -v aws >/dev/null 2>&1 || snap install aws-cli --classic",
              "aws ecr get-login-password --region \($region) | docker login --username AWS --password-stdin \($registry)",
              "docker pull \($image)",
              "docker run --rm --entrypoint cat \($image) deploy/deploy.sh > /tmp/motivetag-deploy.sh",
              "bash /tmp/motivetag-deploy.sh \($image) \($region) \($bucket)"
            ]}')
          command_id=$(aws ssm send-command --instance-ids "$instance_id" \
            --document-name AWS-RunShellScript --timeout-seconds 900 \
            --comment "deploy ${GITHUB_SHA::7}" --parameters "$params" \
            --query Command.CommandId --output text)
          while true; do
            sleep 10
            status=$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$instance_id" --query Status --output text 2>/dev/null || echo Pending)
            case $status in Pending|InProgress|Delayed) continue ;; esac
            break
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance_id" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "Deploy finished with status: $status"
          [ "$status" = Success ]
      - name: Check the live site
        run: curl -fsS --retry 10 --retry-delay 6 --retry-all-errors https://motivetag.com/healthz
