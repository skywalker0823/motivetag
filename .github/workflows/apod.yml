# Posts today's NASA Astronomy Picture of the Day on the live site now, instead of
# waiting for motivetag-apod.timer (scripts/apod.py): Actions → APOD post → Run
# workflow. "dry-run" only shows the post. A day already posted is skipped.
name: APOD post

on:
  workflow_dispatch:
    inputs:
      action:
        description: post = post today's picture, dry-run = only show the post
        type: choice
        options: [post, dry-run]
        default: post

permissions:
  contents: read
  id-token: write # OIDC token for AWS; no stored keys

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  run:
    # The deploy role only trusts main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Run scripts/apod.py in the app container
        env:
          ACTION: ${{ inputs.action }}
        run: |
          instance_id=$(aws ec2 describe-instances \
            --filters Name=tag:Project,Values=motivetag Name=instance-state-name,Values=running \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          params=$(jq -n --arg action "$ACTION" '{commands: [
            "set -e",
            "cd /srv/motivetag/app",
            "docker compose exec -T app python scripts/apod.py \(if $action == "dry-run" then "--dry-run" else "" end)"
          ]}')
          command_id=$(aws ssm send-command --instance-ids "$instance_id" \
            --document-name AWS-RunShellScript --timeout-seconds 600 \
            --comment "apod $ACTION" --parameters "$params" \
            --query Command.CommandId --output text)
          while true; do
            sleep 5
            status=$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$instance_id" --query Status --output text 2>/dev/null || echo Pending)
            case $status in Pending|InProgress|Delayed) continue ;; esac
            break
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance_id" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text | grep -v '^try to connect\|^Connect to host' || true
          echo "Finished with status: $status"
          [ "$status" = Success ]
