# Posts today's NASA Astronomy Picture of the Day on the live site now, instead of
# waiting for motivetag-apod.timer (scripts/apod.py): Actions → APOD post → Run
# workflow. "dry-run" only shows the post; "repost" deletes the bot's post for today
# and posts it again (to fix a bad one). Otherwise a day already posted is skipped.
name: APOD post

on:
  workflow_dispatch:
    inputs:
      action:
        description: post = post today's picture, dry-run = only show the post, repost = replace today's post
        type: choice
        options: [post, dry-run, repost]
        default: post
      date:
        description: Another day (YYYY-MM-DD), empty = today
        type: string
        required: false

permissions:
  contents: read
  id-token: write # OIDC token for AWS; no stored keys

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  run:
    # The deploy role only trusts main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Run scripts/apod.py in the app container
        env:
          ACTION: ${{ inputs.action }}
          DATE: ${{ inputs.date }}
        run: |
          # The date becomes part of a shell command on the server: digits and dashes only.
          if [ -n "$DATE" ] && ! [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "date must look like 2026-10-05"; exit 1
          fi
          instance_id=$(aws ec2 describe-instances \
            --filters Name=tag:Project,Values=motivetag Name=instance-state-name,Values=running \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          params=$(jq -n --arg action "$ACTION" --arg date "$DATE" '{commands: [
            "set -e",
            "cd /srv/motivetag/app",
            "docker compose exec -T app python scripts/apod.py \({"post": "", "dry-run": "--dry-run", "repost": "--replace"}[$action])\(if $date == "" then "" else " --date " + $date end)"
          ]}')
          command_id=$(aws ssm send-command --instance-ids "$instance_id" \
            --document-name AWS-RunShellScript --timeout-seconds 600 \
            --comment "apod $ACTION" --parameters "$params" \
            --query Command.CommandId --output text)
          while true; do
            sleep 5
            status=$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$instance_id" --query Status --output text 2>/dev/null || echo Pending)
            case $status in Pending|InProgress|Delayed) continue ;; esac
            break
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance_id" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text | grep -v '^try to connect\|^Connect to host' || true
          echo "Finished with status: $status"
          [ "$status" = Success ]
